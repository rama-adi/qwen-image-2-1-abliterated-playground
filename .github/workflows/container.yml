name: Test and publish RunPod image
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ui.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q app.py inference_worker.py download_models.py lora_store.py adapter_compat.py reference_roles.py
      - run: bash -n setup-macos.sh runpod/entrypoint.sh
      - run: node --check static/app.js
      - run: node --test tests/test_stream_client.cjs
  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check runner disk space (bounded cleanup if needed)
        run: |
          # BuildKit publishes directly; no second full image in Docker's image store.
          # Avoid deleting millions of SDK files on runners that already have room.
          target_kib=$((25 * 1024 * 1024))
          available_kib() { df -Pk /var/lib/docker | awk 'NR==2 {print $4}'; }
          df -h /var/lib/docker
          for sdk in /usr/local/lib/android /usr/share/dotnet /opt/ghc; do
            if (( $(available_kib) >= target_kib )); then break; fi
            echo "Freeing unused SDK: $sdk (maximum 20 seconds)"
            if sudo timeout 20s rm -rf "$sdk"; then
              echo "Cleanup completed"
            else
              echo "::warning::SDK cleanup stopped early; continuing with available disk space"
            fi
          done
          df -h /var/lib/docker
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, validate, and publish image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: runpod/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
            type=gha
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref=ghcr.io/{0}:buildcache,mode=max', github.repository) || '' }}

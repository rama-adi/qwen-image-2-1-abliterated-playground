name: Test and publish RunPod image
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ui.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q app.py inference_worker.py download_models.py
      - run: bash -n setup-macos.sh runpod/entrypoint.sh
      - run: node --check static/app.js
      - run: node --test tests/test_stream_client.cjs
  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
      - name: Build image for testing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: runpod/Dockerfile
          platforms: linux/amd64
          load: true
          tags: playground:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify image imports and authenticated HTTP startup
        run: |
          docker run --rm --entrypoint python playground:test -c 'from diffusers import QwenImage21Pipeline; from transformers import Qwen3VLForConditionalGeneration, AutoModelForImageTextToText; import torch, wsproto; assert torch.version.cuda; print(torch.__version__)'
          docker run -d --name playground -p 8765:8765 \
            -e PLAYGROUND_PASSWORD=ci-test-only \
            -e PLAYGROUND_DOWNLOAD_MODELS=0 -e PLAYGROUND_REQUIRE_CUDA=0 \
            -v playground-data:/workspace playground:test
          trap 'docker logs playground; docker rm -f playground' EXIT
          python tests/smoke_http.py
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag playground:test "$tag"
            docker push "$tag"
          done <<< "$TAGS"
